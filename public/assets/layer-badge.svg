<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Layer 3 (Bottom) -->
    <linearGradient id="layerWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Layer 2 (Middle Vibrant Orange) -->
    <linearGradient id="layerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(10, 8)">
    <!-- BOTTOM LAYER (WHITE) -->
    <g transform="translate(0, 36)">
      <!-- 3D extrusion skirt -->
      <path d="M 50 18 L 86 36 L 86 46 L 50 64 L 14 46 L 14 36 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Top face -->
      <path d="M 50 18 L 86 36 L 50 54 L 14 36 Z" fill="url(#layerWhite)" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- MIDDLE LAYER (ORANGE ACCENT) -->
    <g transform="translate(0, 18)">
      <!-- 3D extrusion skirt -->
      <path d="M 50 18 L 86 36 L 86 46 L 50 64 L 14 46 L 14 36 Z" fill="#c2410c" stroke="#9a3412" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Top face -->
      <path d="M 50 18 L 86 36 L 50 54 L 14 36 Z" fill="url(#layerOrange)" stroke="#9a3412" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- TOP LAYER (WHITE + PADLOCK) -->
    <g transform="translate(0, 0)">
      <!-- 3D extrusion skirt -->
      <path d="M 50 18 L 86 36 L 86 46 L 50 64 L 14 46 L 14 36 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Top face -->
      <path d="M 50 18 L 86 36 L 50 54 L 14 36 Z" fill="url(#layerWhite)" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- ISOMETRIC PADLOCK GLYPH ON TOP -->
      <g transform="translate(42, 28)">
        <!-- Padlock shackle -->
        <path d="M 5 6 C 5 2 11 2 11 6" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- Padlock body -->
        <rect x="2" y="6" width="12" height="9" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
        <!-- Keyhole dot -->
        <circle cx="8" cy="10.5" r="1.2" fill="#1e293b"/>
      </g>
    </g>
  </g>
</svg>
