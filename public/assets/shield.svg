<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" fill="none">
  <defs>
    <!-- Ceramic White Shield Face Gradient -->
    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- 3D Bevel Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Warm Orange Accent Bevel -->
    <linearGradient id="orangeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Dark 3D Checkmark Gradient -->
    <linearGradient id="checkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Volumetric Drop Shadow Filter -->
    <filter id="shieldShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="checkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shieldShadow)" transform="rotate(-4, 190, 170)">
    <!-- Shield Outer 3D Extrusion Lip -->
    <path d="M 190 25 C 265 25 315 50 315 115 C 315 220 220 285 190 305 C 160 285 65 220 65 115 C 65 50 115 25 190 25 Z" 
          transform="translate(4, 10)" fill="#1e232a"/>

    <!-- Shield Outer Rim Bevel -->
    <path d="M 190 25 C 265 25 315 50 315 115 C 315 220 220 285 190 305 C 160 285 65 220 65 115 C 65 50 115 25 190 25 Z" 
          fill="url(#shieldRim)"/>

    <!-- Neon Orange Inner Inset Rim -->
    <path d="M 190 40 C 250 40 292 62 292 118 C 292 205 212 265 190 282 C 168 265 88 205 88 118 C 88 62 130 40 190 40 Z" 
          fill="url(#orangeBevel)"/>

    <!-- Ceramic Shield Inner Face -->
    <path d="M 190 52 C 240 52 278 72 278 120 C 278 195 208 248 190 262 C 172 248 102 195 102 120 C 102 72 140 52 190 52 Z" 
          fill="url(#shieldFace)"/>

    <!-- Subtle Ceramic Surface Highlight Sweep -->
    <path d="M 190 54 C 235 54 270 72 272 115 C 230 110 170 145 155 190 C 130 160 105 135 105 118 C 105 72 145 54 190 54 Z" 
          fill="#ffffff" opacity="0.45"/>

    <!-- Perimeter Studs / Stitching Details -->
    <circle cx="190" cy="62" r="2.5" fill="#94a3b8"/>
    <circle cx="230" cy="72" r="2.5" fill="#94a3b8"/>
    <circle cx="260" cy="100" r="2.5" fill="#94a3b8"/>
    <circle cx="270" cy="140" r="2.5" fill="#94a3b8"/>
    <circle cx="260" cy="180" r="2.5" fill="#94a3b8"/>
    <circle cx="235" cy="215" r="2.5" fill="#94a3b8"/>
    <circle cx="190" cy="245" r="2.5" fill="#94a3b8"/>
    <circle cx="145" cy="215" r="2.5" fill="#94a3b8"/>
    <circle cx="120" cy="180" r="2.5" fill="#94a3b8"/>
    <circle cx="110" cy="140" r="2.5" fill="#94a3b8"/>
    <circle cx="120" cy="100" r="2.5" fill="#94a3b8"/>
    <circle cx="150" cy="72" r="2.5" fill="#94a3b8"/>

    <!-- Central 3D Checkmark -->
    <g filter="url(#checkShadow)">
      <!-- Checkmark 3D Depth Extrusion -->
      <path d="M 148 148 L 175 178 L 225 115 C 232 108 243 110 248 118 C 253 125 250 135 242 142 L 184 212 C 178 218 168 218 162 212 L 132 178 C 125 170 128 160 135 152 C 141 146 145 146 148 148 Z" 
            transform="translate(1, 3)" fill="#090d16"/>

      <!-- Checkmark Front Face -->
      <path d="M 148 148 L 175 178 L 225 115 C 232 108 243 110 248 118 C 253 125 250 135 242 142 L 184 212 C 178 218 168 218 162 212 L 132 178 C 125 170 128 160 135 152 C 141 146 145 146 148 148 Z" 
            fill="url(#checkMetal)"/>
      <path d="M 150 152 L 173 178 L 228 118" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>
  </g>
</svg>
