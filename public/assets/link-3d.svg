<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" fill="none">
  <defs>
    <!-- Metallic Blue Chrome Gradient -->
    <linearGradient id="linkChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#dbeafe"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Cyber Core Gradient -->
    <linearGradient id="linkCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Radar Disc Gradient -->
    <radialGradient id="radarDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="link3DShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#link3DShadow)" transform="translate(10, 10)">
    <!-- Background Cyber Orbital Grid Rings -->
    <ellipse cx="180" cy="150" rx="140" ry="60" fill="url(#radarDisc)"/>
    <ellipse cx="180" cy="150" rx="130" ry="50" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" transform="rotate(-15, 180, 150)"/>
    <ellipse cx="180" cy="150" rx="80" ry="30" stroke="#60a5fa" stroke-width="1" opacity="0.35" transform="rotate(-15, 180, 150)"/>

    <!-- Left 3D Chain Link Loop -->
    <g transform="rotate(-25, 130, 140)">
      <!-- 3D Depth Shadow under Left Ring -->
      <rect x="70" y="90" width="105" height="60" rx="30" fill="#090d16" transform="translate(4, 10)"/>
      <!-- Outer Metal Body -->
      <rect x="70" y="90" width="105" height="60" rx="30" fill="url(#linkChrome)" stroke="#93c5fd" stroke-width="2"/>
      <!-- Inner Cutout Hole -->
      <rect x="94" y="105" width="57" height="30" rx="15" fill="#111318"/>
      <!-- Specular Highlight Arc -->
      <path d="M 90 92 Q 120 88 155 92" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Central Connecting Beam / Energy Node -->
    <g transform="translate(145, 115)">
      <circle cx="35" cy="35" r="28" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="35" cy="35" r="20" fill="url(#linkCyanGlow)"/>
      <circle cx="35" cy="35" r="10" fill="#ffffff" opacity="0.95"/>
      <!-- Scan Beam Pulse -->
      <line x1="10" y1="35" x2="60" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
    </g>

    <!-- Right 3D Chain Link Loop -->
    <g transform="rotate(-25, 230, 160)">
      <!-- 3D Depth Shadow under Right Ring -->
      <rect x="170" y="110" width="105" height="60" rx="30" fill="#090d16" transform="translate(4, 10)"/>
      <!-- Outer Metal Body -->
      <rect x="170" y="110" width="105" height="60" rx="30" fill="url(#linkChrome)" stroke="#93c5fd" stroke-width="2"/>
      <!-- Inner Cutout Hole -->
      <rect x="194" y="125" width="57" height="30" rx="15" fill="#111318"/>
      <!-- Specular Highlight Arc -->
      <path d="M 190 112 Q 220 108 255 112" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Glowing Cyber Particle Dots -->
    <circle cx="75" cy="110" r="3" fill="#67e8f9"/>
    <circle cx="280" cy="190" r="3.5" fill="#60a5fa"/>
    <circle cx="120" cy="220" r="2.5" fill="#22c55e"/>
    <circle cx="240" cy="80" r="2.5" fill="#a855f7"/>
  </g>
</svg>
