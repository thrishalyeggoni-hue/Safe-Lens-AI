<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" fill="none">
  <defs>
    <!-- Matte Obsidian Cam Body -->
    <linearGradient id="mediaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glass Blue Aperture Element -->
    <radialGradient id="mediaGlass" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Chrome Focus Bezel Ring -->
    <linearGradient id="mediaBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Spectrum Waveform Gradient -->
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <filter id="mediaShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-5" dy="22" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#mediaShadow)" transform="translate(15, 10)">
    <!-- 3D Film Spool / Cinema Canister Behind -->
    <g transform="translate(190, 40)">
      <ellipse cx="60" cy="60" rx="50" ry="50" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <ellipse cx="60" cy="60" rx="42" ry="42" fill="#0f172a"/>
      <!-- Spool Windows -->
      <circle cx="45" cy="45" r="10" fill="#334155"/>
      <circle cx="75" cy="45" r="10" fill="#334155"/>
      <circle cx="45" cy="75" r="10" fill="#334155"/>
      <circle cx="75" cy="75" r="10" fill="#334155"/>
      <circle cx="60" cy="60" r="8" fill="#64748b"/>
    </g>

    <!-- Main Studio Camera / Recorder Chassis -->
    <g transform="translate(50, 70)">
      <!-- 3D Extrusion Shadow (Bottom) -->
      <rect x="0" y="0" width="190" height="135" rx="24" fill="#020617" transform="translate(4, 12)"/>
      <!-- Main Body Box -->
      <rect x="0" y="0" width="190" height="135" rx="24" fill="url(#mediaBody)" stroke="#64748b" stroke-width="2"/>

      <!-- Top Audio Mic Cylinder -->
      <rect x="35" y="-18" width="80" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="105" cy="-8" r="4" fill="#ef4444"/>

      <!-- Optical Front Glass Barrel -->
      <g transform="translate(145, 68)">
        <!-- Outer Focus Grip Ring -->
        <circle cx="0" cy="0" r="48" fill="url(#mediaBezel)"/>
        <!-- Stepped Ridge -->
        <circle cx="0" cy="0" r="42" fill="#090d16"/>
        <circle cx="0" cy="0" r="38" fill="url(#mediaGlass)"/>
        <!-- Specular Highlight Curve -->
        <ellipse cx="-12" cy="-14" rx="18" ry="10" fill="#ffffff" opacity="0.65" transform="rotate(-30, -12, -14)"/>
        <circle cx="16" cy="16" r="4" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- Video Play / Waveform Ribbon Panel -->
      <rect x="20" y="24" width="75" height="42" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
      <!-- Audio Waveform Bars -->
      <line x1="32" y1="45" x2="32" y2="45" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="36" x2="40" y2="54" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="30" x2="48" y2="60" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="56" y1="38" x2="56" y2="52" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="64" y1="42" x2="64" y2="48" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="40" x2="72" y2="50" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="45" x2="80" y2="45" stroke="url(#waveGlow)" stroke-width="3" stroke-linecap="round"/>

      <!-- Status Indicator LED Strip -->
      <circle cx="26" cy="100" r="3.5" fill="#22c55e"/>
      <circle cx="38" cy="100" r="3.5" fill="#38bdf8"/>
      <circle cx="50" cy="100" r="3.5" fill="#f59e0b"/>
    </g>
  </g>
</svg>
