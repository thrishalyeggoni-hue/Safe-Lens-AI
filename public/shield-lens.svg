<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="irisGrad" cx="50" cy="50" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>
  </defs>
  <!-- Shield Outer -->
  <path d="M50 8 C68 8, 86 16, 86 32 C86 64, 58 86, 50 92 C42 86, 14 64, 14 32 C14 16, 32 8, 50 8 Z" 
        fill="white" stroke="#2563eb" stroke-width="4.5" stroke-linejoin="round" />
  <!-- Protective Lens Ring -->
  <circle cx="50" cy="46" r="23" stroke="#2563eb" stroke-width="4" fill="#eff6ff" />
  <!-- Iris Eye Core -->
  <circle cx="50" cy="46" r="15" fill="url(#irisGrad)" />
  <!-- Pupil -->
  <circle cx="50" cy="46" r="7.5" fill="#090d16" />
  <!-- Glass Reflection -->
  <circle cx="46" cy="42" r="3.5" fill="white" opacity="0.9" />
  <circle cx="53" cy="49" r="1.5" fill="white" opacity="0.6" />
</svg>
